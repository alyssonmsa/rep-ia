image: node:22-alpine

stages:
  - test
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
    - npm run test

# Nome e artifacts:paths: public são a convenção clássica do GitLab Pages —
# funciona em qualquer versão do GitLab, sem depender da sintaxe nova
# (pages: true / pages.publish) de instâncias mais recentes.
pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
